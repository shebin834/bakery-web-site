<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Orders</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; padding: 30px; margin: 0; }
        h1 { text-align: center; color: #333; }
        .orders-container { max-width: 900px; margin: 0 auto; }
        .order-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; border-left: 5px solid #ffc107; }
        .order-card.completed { border-left-color: #28a745; opacity: 0.8; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2em; margin-bottom: 10px; }
        .order-details p { margin: 5px 0; color: #555; }
        .items-list { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        .complete-btn { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .complete-btn:hover { background-color: #218838; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8em; color: white; }
        .status-pending { background-color: #ffc107; color: black; }
        .status-completed { background-color: #28a745; }
    </style>
</head>
<body>

    <h1>Bakery Orders Dashboard 📦</h1>
    <div class="orders-container" id="orders-container">
        <p style="text-align: center;">Loading orders...</p>
    </div>

    <script>
        // Fetch all orders from backend
        function fetchOrders() {
            fetch('http://127.0.0.1:5000/api/orders')
                .then(response => response.json())
                .then(orders => {
                    const container = document.getElementById('orders-container');
                    container.innerHTML = ''; // Clear loading text

                    if(orders.length === 0) {
                        container.innerHTML = '<p style="text-align: center;">No orders yet.</p>';
                        return;
                    }

                    orders.forEach(order => {
                        const isCompleted = order.status === 'Completed';
                        const statusClass = isCompleted ? 'status-completed' : 'status-pending';
                        const cardClass = isCompleted ? 'order-card completed' : 'order-card';
                        
                        // Item list formatting
                        const itemsString = order.items.join(', ');

                        let orderHTML = `
                            <div class="${cardClass}">
                                <div class="order-header">
                                    <span>${order.customer_name}</span>
                                    <span class="status-badge ${statusClass}">${order.status}</span>
                                </div>
                                <div class="order-details">
                                    <p>📞 Phone: ${order.phone}</p>
                                    <p>📍 Address: ${order.address}</p>
                                    <p>💰 Total: ₹${order.total_amount}</p>
                                </div>
                                <div class="items-list">
                                    🛒 Items: ${itemsString}
                                </div>
                        `;

                        // Add "Mark as Completed" button only if status is Pending
                        if(!isCompleted) {
                            orderHTML += `<button class="complete-btn" onclick="markCompleted('${order._id}')">Mark as Completed ✔</button>`;
                        }

                        orderHTML += `</div>`;
                        container.innerHTML += orderHTML;
                    });
                })
                .catch(error => console.error('Error fetching orders:', error));
        }

        // Update Order Status
        function markCompleted(orderId) {
            fetch(`http://127.0.0.1:5000/api/update-order/${orderId}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                fetchOrders(); // Refresh the list
            })
            .catch(error => console.error('Error updating order:', error));
        }

        // Load orders on page start
        window.onload = fetchOrders;
    </script>

</body>
</html>
