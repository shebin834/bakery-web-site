<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Admin - Manage Items</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        
        .container-wrapper { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px; }
        .form-container, .manage-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; flex: 1; min-width: 300px; }
        
        h2 { text-align: center; color: #333; margin-bottom: 25px; font-size: 1.5em; }
        input, select, button { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        
        input[type="file"] { padding: 10px; background-color: #f9f9f9; cursor: pointer; }
        .preview-img { width: 100%; max-height: 150px; object-fit: cover; display: none; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ddd; }
        
        .add-btn { background-color: #2e8b57; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .add-btn:hover { background-color: #246b43; }
        #message { text-align: center; color: green; font-weight: bold; margin-top: 10px; }
        
        /* New Styles for Manage Items Section */
        .admin-product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; background: #fdfdfd; margin-bottom: 8px; border-radius: 5px; }
        .admin-product-item:hover { background: #f5f5f5; }
        .product-details { display: flex; align-items: center; gap: 10px; }
        .item-name { font-weight: 600; color: #333; }
        .item-price { color: #A83232; font-weight: bold; font-size: 0.9em; }
        .delete-btn { width: auto; margin: 0; padding: 6px 12px; background-color: #ff4c4c; color: white; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .delete-btn:hover { background-color: #d13030; }
        .small-img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container-wrapper">
        <div class="form-container">
            <h2>Add Bakery Item 🥐</h2>
            <input type="text" id="name" placeholder="Item Name (eg: Chocolate Cake)" required>
            <input type="number" id="price" placeholder="Price (₹)" required>
            
            <select id="category">
                <option value="Juice">Juice / Shakes</option>
                <option value="Cold Beverages">Cold Beverages</option>
                <option value="Ice Cream">Ice Cream</option>
                <option value="Dessert">Dessert</option>
                <option value="Snacks">Snacks (Samosa, Puffs)</option>
                <option value="Biscuit">Biscuits & Cookies</option>
                <option value="Birthday Cake">Birthday Cake</option>
                <option value="Savory Mixtures">Savory Mixtures (Mixture)</option>
                <option value="Fresh Fruits">Fresh Fruits</option>
                <option value="Coffee">Coffee</option>
                <option value="Tea">Tea</option>
            </select>
            
            <label for="image_file" style="font-size: 13px; font-weight: 500; color: #555; margin-bottom: 5px; display: block;">Upload Item Photo:</label>
            <input type="file" id="image_file" accept="image/*" onchange="previewImage(event)">
            <img id="preview" class="preview-img" alt="Image Preview">
            
            <button onclick="processAndAddProduct()" id="submit-btn" class="add-btn">Add to Menu</button>
            <p id="message"></p>
        </div>

        <div class="manage-container">
            <h2>Manage Menu 📋</h2>
            <div id="admin-product-list" style="max-height: 400px; overflow-y: auto;">
                <p style="text-align: center; color: #777;">Loading items...</p>
            </div>
        </div>
    </div>

    <script>
        // --------- Add Product Functions ---------
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function processAndAddProduct() {
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Adding Item..."; btn.disabled = true;
            const file = document.getElementById('image_file').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() { sendDataToServer(reader.result); }
                reader.readAsDataURL(file);
            } else {
                sendDataToServer("https://images.unsplash.com/photo-1509365465994-3b5e40e6b72a?w=400&q=80");
            }
        }

        function sendDataToServer(imageUrl) {
            const product = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                category: document.getElementById('category').value,
                image_url: imageUrl
            };
            fetch('https://bakery-web-site.onrender.com/api/add-product', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(product)
            })
            .then(res => res.json())
            .then(data => {
                const msgBox = document.getElementById('message');
                msgBox.innerText = "✅ " + data.message; msgBox.style.color = "green";
                
                // Clear Form
                document.getElementById('name').value = ''; document.getElementById('price').value = '';
                document.getElementById('image_file').value = ''; document.getElementById('preview').style.display = 'none';
                
                const btn = document.getElementById('submit-btn');
                btn.innerText = "Add to Menu"; btn.disabled = false;
                setTimeout(() => { msgBox.innerText = ''; }, 3000);
                
                loadAdminProducts(); // Refresh the list automatically
            });
        }

        // --------- Manage (Delete) Product Functions ---------
        function loadAdminProducts() {
            fetch('https://bakery-web-site.onrender.com/api/products')
            .then(response => response.json())
            .then(products => {
                const listContainer = document.getElementById('admin-product-list');
                listContainer.innerHTML = '';
                if(products.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #777;">Menu is currently empty.</p>';
                    return;
                }
                products.forEach(item => {
                    listContainer.innerHTML += `
                        <div class="admin-product-item">
                            <div class="product-details">
                                <img src="${item.image_url}" class="small-img" onerror="this.src='https://images.unsplash.com/photo-1509365465994-3b5e40e6b72a?w=400&q=80'">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-price">₹${item.price}</div>
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteProduct('${item._id}', '${item.name}')">Delete</button>
                        </div>
                    `;
                });
            });
        }

        function deleteProduct(id, name) {
            // Confirmation popup before deleting
            if(!confirm(`Are you sure you want to delete "${name}" from the menu?`)) return;
            
            fetch('https://bakery-web-site.onrender.com/api/delete-product/' + id, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                alert("✅ Item deleted successfully!");
                loadAdminProducts(); // Refresh the list after deleting
            })
            .catch(err => console.error("Error deleting:", err));
        }

        // Load items when page opens
        window.onload = loadAdminProducts;
    </script>

</body>
</html>
