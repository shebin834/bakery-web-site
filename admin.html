<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Admin - Add Items</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input, select, button { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        /* Puthiya image upload input-nu vendiyulla style */
        input[type="file"] { padding: 10px; background-color: #f9f9f9; cursor: pointer; }
        .preview-img { width: 100%; max-height: 200px; object-fit: cover; display: none; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ddd; }
        
        button { background-color: #ff6b6b; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #ff4c4c; }
        #message { text-align: center; color: green; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Add Bakery Item 🥐</h2>
        <input type="text" id="name" placeholder="Item Name (eg: Chocolate Cake)" required>
        <input type="number" id="price" placeholder="Price (₹)" required>
        
        <select id="category">
            <option value="Juice">Juice</option>
            <option value="Cold Beverages">Cold Beverages</option>
            <option value="Ice Cream">Ice Cream</option>
            <option value="Dessert">Dessert</option>
            <option value="Snacks">Snacks</option>
            <option value="Birthday Cake">Birthday Cake</option>
            <option value="Savory Mixtures">Savory Mixtures</option>
            <option value="Fresh Fruits">Fresh Fruits</option>
            <option value="Coffee">Coffee</option>
            <option value="Tea">Tea</option>
        </select>
        
        <label for="image_file" style="font-size: 14px; font-weight: 500; color: #555; margin-bottom: 5px; display: block;">Upload Item Photo:</label>
        <input type="file" id="image_file" accept="image/*" onchange="previewImage(event)">
        
        <img id="preview" class="preview-img" alt="Image Preview">
        
        <button onclick="processAndAddProduct()" id="submit-btn">Add to Menu</button>
        <p id="message"></p>
    </div>

    <script>
        // Photo select cheyyumbol ath preview aayi kanikkan
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            if(event.target.files[0]){
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // Photo file-ne string aakki databaselottu ayakkan
        function processAndAddProduct() {
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Adding Item...";
            btn.disabled = true;

            const fileInput = document.getElementById('image_file');
            const file = fileInput.files[0];

            if (file) {
                // File undenkil athine read cheyyunnu
                const reader = new FileReader();
                reader.onloadend = function() {
                    const base64String = reader.result;
                    sendDataToServer(base64String);
                }
                reader.readAsDataURL(file);
            } else {
                // File onnum upload cheythillenkil oru default placeholder kodukkunnu
                const defaultImage = "https://images.unsplash.com/photo-1509365465994-3b5e40e6b72a?w=400&q=80";
                sendDataToServer(defaultImage);
            }
        }

        // Serverilekku data ayakkunna main function
        function sendDataToServer(imageUrl) {
            const product = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                category: document.getElementById('category').value,
                image_url: imageUrl
            };

            // Corrected Render Live URL here
            fetch('https://bakery-web-site.onrender.com/api/add-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            })
            .then(response => response.json())
            .then(data => {
                const msgBox = document.getElementById('message');
                msgBox.innerText = "✅ " + data.message;
                msgBox.style.color = "green";
                
                // Form clear cheyyuka
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                document.getElementById('image_file').value = '';
                document.getElementById('preview').style.display = 'none';
                
                const btn = document.getElementById('submit-btn');
                btn.innerText = "Add to Menu";
                btn.disabled = false;

                // 3 second kazhinjal message mayam
                setTimeout(() => { msgBox.innerText = ''; }, 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('message').innerText = "❌ Failed to add item.";
                document.getElementById('message').style.color = "red";
                document.getElementById('submit-btn').innerText = "Add to Menu";
                document.getElementById('submit-btn').disabled = false;
            });
        }
    </script>

</body>
</html>
